name: Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax and imports
        run: |
          python -m compileall -q MemStat.py memstat_core.py
          python -c 'import MemStat; import memstat_core'